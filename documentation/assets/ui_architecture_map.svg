  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bgGrad)" rx="12"/>

  <!-- MODULE A: HEADER BAR -->
  <rect x="20" y="16" width="1160" height="72" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="38" y="42" fill="#F59E0B" font-family="monospace" font-size="15" font-weight="bold">MODULE A // MISSION CONTROL HEADER &amp; SCENARIO BAR</text>
  <rect x="440" y="25" width="230" height="24" rx="5" fill="#F59E0B"/>
  <text x="555" y="41" text-anchor="middle" fill="#0B0F19" font-family="monospace" font-size="11" font-weight="bold">Split-Screen Compare (A vs B)</text>
  <rect x="680" y="25" width="180" height="24" rx="5" fill="#1E293B" stroke="#475569"/>
  <text x="770" y="41" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">Single-Site Deep Dive</text>
  <rect x="880" y="25" width="135" height="24" rx="5" fill="#1E293B" stroke="#F59E0B"/>
  <text x="947" y="41" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="11">Planner | Educator</text>
  <rect x="1025" y="25" width="140" height="24" rx="5" fill="#0F172A" stroke="#38BDF8"/>
  <text x="1095" y="41" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="11">Tutorial &amp; Guide</text>
  <text x="38" y="72" fill="#CBD5E1" font-family="monospace" font-size="11">[Site Dropdown + Polar Map Picker]   [Base UTC Date: 2026-12-01]   [14d | 30d | 60d]   [Hardware: Vertical 360° Mast (12m², 1.0° DTE)]</text>

