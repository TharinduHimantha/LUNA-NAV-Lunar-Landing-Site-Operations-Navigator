  <text x="38" y="730" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">6. Mission Viability Verdict  [ 85.3/100 OPTIMAL ]         [ 4.2/100 CRITICAL_RISK ]  -81.1 pts</text>

