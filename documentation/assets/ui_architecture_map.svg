  <!-- Right 3D Pane (Scenario B) -->
  <rect x="610" y="266" width="570" height="235" rx="10" fill="#090D16" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="626" y="290" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">PANE B // 3D LOLA 128×128 DEM: HAWORTH CRATER FLOOR (PSR)</text>
  <ellipse cx="895" cy="395" rx="210" ry="62" fill="#1E1B4B" stroke="#6366F1"/>
  <text x="895" y="432" text-anchor="middle" fill="#A5B4FC" font-family="monospace" font-size="10" font-weight="bold">89.5% Cryogenic PSR Basin (&lt;45K — Blocked by 4.5° Crater Walls)</text>
  <circle cx="735" cy="340" r="9" fill="#EF4444"/>
