<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <rect width="960" height="460" rx="12" fill="#0B0F19"/>
  <text x="30" y="36" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="bold">SOUTH POLE GRAZING GEOMETRY, COLD TRAPS &amp; SOLAR ARRAY PHYSICS</text>
  <text x="30" y="56" fill="#94A3B8" font-family="monospace" font-size="12">Why Elevation, Curvature Drop (-d²/2R), and Vertical Masts Govern Survival at 89.5°S</text>

  <!-- Left Panel: Terrain Cross-Section (Peak of Eternal Light vs PSR Cold Trap) -->
  <rect x="25" y="75" width="540" height="360" rx="10" fill="#111827" stroke="#334155"/>
  <text x="42" y="102" fill="#F59E0B" font-family="monospace" font-size="13" font-weight="bold">A. TOPOGRAPHIC CROSS-SECTION AT 89.5°S</text>

  <!-- Grazing Sun Rays -->
  <circle cx="75" cy="185" r="22" fill="#F59E0B"/>
  <text x="75" y="152" text-anchor="middle" fill="#FDE68A" font-family="monospace" font-size="11" font-weight="bold">GRAZING SUN (+1.5° El)</text>
  <line x1="100" y1="180" x2="530" y2="215" stroke="#F59E0B" stroke-width="2.5"/>
  <line x1="100" y1="195" x2="255" y2="208" stroke="#F59E0B" stroke-width="2.5"/>
  <line x1="255" y1="208" x2="530" y2="232" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Terrain Profile: High Peak -> Deep PSR Basin -> Far Rim -->
  <path d="M 45,360 L 180,320 L 255,208 L 315,345 L 435,355 L 495,245 L 545,360 Z" fill="#1E293B" stroke="#64748B" stroke-width="2"/>

  <!-- PSR Cold Trap Indigo Fill in Crater Floor -->
  <path d="M 275,255 L 315,345 L 435,355 L 478,280 Z" fill="#312E81" fill-opacity="0.75" stroke="#6366F1" stroke-width="1.5"/>
  <text x="375" y="318" text-anchor="middle" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold">PERMANENTLY SHADOWED REGION</text>
  <text x="375" y="335" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="10">Temp: ~40 K (-233°C) • Water Ice Cold Trap</text>

  <!-- Lander on Shackleton Peak -->
  <rect x="249" y="182" width="12" height="26" fill="#10B981" stroke="#FFFFFF" stroke-width="1"/>
  <text x="255" y="172" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10" font-weight="bold">Shackleton Ridge (+2150m)</text>
  <text x="255" y="388" text-anchor="middle" fill="#FDE68A" font-family="monospace" font-size="10">Sunlit Ridge: ~215 K (-58°C) • &gt;90% Sunlight</text>
  <text x="295" y="415" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">Curvature Correction: ΔZ = -d² / (2 · R_moon) = -28.8m at d=10km</text>

  <!-- Right Panel: Vertical Cylindrical Mast vs Horizontal Flat Deck -->
  <rect x="585" y="75" width="350" height="360" rx="10" fill="#111827" stroke="#334155"/>
  <text x="602" y="102" fill="#10B981" font-family="monospace" font-size="13" font-weight="bold">B. SOLAR ARRAY GEOMETRY AT +1.5° SUN</text>

  <!-- Case 1: Vertical Cylindrical Mast -->
  <rect x="605" y="122" width="310" height="135" rx="8" fill="#0B0F19" stroke="#10B981"/>
  <text x="620" y="144" fill="#10B981" font-family="monospace" font-size="11" font-weight="bold">1. VERTICAL CYLINDRICAL MAST (OPTIMAL)</text>
  <!-- Grazing Rays hitting vertical cylinder -->
  <line x1="620" y1="185" x2="700" y2="188" stroke="#F59E0B" stroke-width="2"/>
  <line x1="620" y1="205" x2="700" y2="208" stroke="#F59E0B" stroke-width="2"/>
  <rect x="702" y="165" width="22" height="62" rx="4" fill="#F59E0B" stroke="#FEF3C7" stroke-width="1.5"/>
  <text x="742" y="185" fill="#E2E8F0" font-family="monospace" font-size="11">η_inc = cos(1.5°) = 99.97%</text>
  <text x="742" y="205" fill="#10B981" font-family="monospace" font-size="13" font-weight="bold">Output: 4.57 kW</text>
  <text x="620" y="244" fill="#94A3B8" font-family="sans-serif" font-size="10">Intercepts horizontal rays head-on from all 360°!</text>

  <!-- Case 2: Horizontal Flat Deck -->
  <rect x="605" y="275" width="310" height="135" rx="8" fill="#0B0F19" stroke="#EF4444"/>
  <text x="620" y="297" fill="#F87171" font-family="monospace" font-size="11" font-weight="bold">2. HORIZONTAL FLAT DECK (FAILS AT POLE)</text>
  <!-- Grazing Rays skimming past flat horizontal panel -->
  <line x1="620" y1="342" x2="735" y2="346" stroke="#F59E0B" stroke-width="2"/>
  <rect x="675" y="348" width="60" height="8" rx="2" fill="#3B82F6" stroke="#93C5FD"/>
  <text x="748" y="340" fill="#E2E8F0" font-family="monospace" font-size="11">η_inc = sin(1.5°) = 2.62%</text>
  <text x="748" y="360" fill="#EF4444" font-family="monospace" font-size="13" font-weight="bold">Output: 0.12 kW (-97%)</text>
  <text x="620" y="396" fill="#94A3B8" font-family="sans-serif" font-size="10">Grazing polar rays skim edge-on across a flat deck!</text>
</svg>

