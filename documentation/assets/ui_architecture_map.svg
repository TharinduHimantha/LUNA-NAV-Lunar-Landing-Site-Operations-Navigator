    <text x="12" y="43" fill="#F59E0B" font-family="monospace" font-size="18" font-weight="bold">+1.42°</text>
    <text x="85" y="42" fill="#94A3B8" font-family="monospace" font-size="10">(+0.81° vs Rim)</text>
    <rect x="12" y="51" width="150" height="16" rx="3" fill="#451A03" stroke="#F59E0B"/>
    <text x="87" y="62" text-anchor="middle" fill="#FDE68A" font-family="monospace" font-size="9" font-weight="bold">CONTINUOUS SUN (720h+)</text>

    <rect x="195" y="0" width="185" height="74" rx="8" fill="#111827" stroke="#38BDF8" stroke-opacity="0.6"/>
    <text x="207" y="20" fill="#94A3B8" font-family="monospace" font-size="10">2. EARTH DTE LINK</text>
    <text x="207" y="43" fill="#38BDF8" font-family="monospace" font-size="18" font-weight="bold">+4.15°</text>
    <text x="280" y="42" fill="#94A3B8" font-family="monospace" font-size="10">(+2.30° Margin)</text>
    <rect x="207" y="51" width="150" height="16" rx="3" fill="#082F49" stroke="#38BDF8"/>
    <text x="282" y="62" text-anchor="middle" fill="#BAE6FD" font-family="monospace" font-size="9" font-weight="bold">EARTHSET IN 86h</text>

    <rect x="390" y="0" width="185" height="74" rx="8" fill="#111827" stroke="#10B981" stroke-opacity="0.6"/>
    <text x="402" y="20" fill="#94A3B8" font-family="monospace" font-size="10">3. ARRAY POWER</text>
    <text x="402" y="43" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="bold">4.51 kW</text>
    <text x="490" y="42" fill="#F59E0B" font-family="monospace" font-size="10">1358 W/m²</text>
    <text x="402" y="63" fill="#94A3B8" font-family="monospace" font-size="9">Incidence η: 100% | Disk: 100%</text>

    <rect x="585" y="0" width="185" height="74" rx="8" fill="#111827" stroke="#334155"/>
    <text x="597" y="20" fill="#94A3B8" font-family="monospace" font-size="10">4. MISSION SUNLIGHT</text>
    <text x="597" y="43" fill="#F59E0B" font-family="monospace" font-size="18" font-weight="bold">100.0%</text>
    <text x="678" y="42" fill="#94A3B8" font-family="monospace" font-size="10">(720h sunlit)</text>
    <rect x="597" y="54" width="160" height="8" rx="4" fill="#F59E0B"/>

    <rect x="780" y="0" width="185" height="74" rx="8" fill="#111827" stroke="#10B981" stroke-opacity="0.6"/>
    <text x="792" y="20" fill="#94A3B8" font-family="monospace" font-size="10">5. MAX ECLIPSE (LIMIT 50h)</text>
    <text x="792" y="43" fill="#10B981" font-family="monospace" font-size="18" font-weight="bold">0.0h</text>
    <text x="850" y="42" fill="#94A3B8" font-family="monospace" font-size="10">continuous dark</text>
    <text x="792" y="63" fill="#6EE7B7" font-family="monospace" font-size="9" font-weight="bold">WITHIN 50h BATTERY SPEC</text>

    <rect x="975" y="0" width="185" height="74" rx="8" fill="#111827" stroke="#10B981"/>
    <text x="987" y="20" fill="#94A3B8" font-family="monospace" font-size="10">6. VIABILITY INDEX</text>
    <text x="987" y="44" fill="#10B981" font-family="monospace" font-size="20" font-weight="bold">85.3</text>
    <rect x="1055" y="28" width="92" height="18" rx="4" fill="#064E3B" stroke="#10B981"/>
    <text x="1101" y="40" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="9" font-weight="bold">OPTIMAL SITE</text>
    <text x="987" y="63" fill="#94A3B8" font-family="monospace" font-size="9">Peak Sun: +1.91° | DTE: 298h</text>
