  <line x1="38" y1="573" x2="690" y2="573" stroke="#334155"/>
  <text x="38" y="595" fill="#E2E8F0" font-family="monospace" font-size="11">1. Power Window               [ 722.0h (100.0%) GREEN ]    [ 0.0h (0.0%) RED ]        -722.0h (-100%)</text>
  <text x="38" y="622" fill="#E2E8F0" font-family="monospace" font-size="11">2. Battery Stress (Max Dark)  [ 0.0h SAFE GREEN ]          [ 722.0h &gt;50h LIMIT RED ]  +722.0h shadow</text>
  <text x="38" y="649" fill="#E2E8F0" font-family="monospace" font-size="11">3. DTE Comms Window           [ 298.0h (41.3%) GREEN ]     [ 0.0h (0.0%) RED ]        -298.0h (-41.3%)</text>
  <text x="38" y="676" fill="#E2E8F0" font-family="monospace" font-size="11">4. Thermal Extremes (Diviner) [ 210K (-63°C) NOMINAL ]     [ 40K (-233°C) CRYO RED ]  -170.0K colder</text>
